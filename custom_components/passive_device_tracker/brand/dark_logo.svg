<svg width="1024" height="320" viewBox="0 0 1024 320" xmlns="http://www.w3.org/2000/svg">
  <style>
    :root {
      color: var(--primary-color, #03a9f4);
    }
  </style>
  <!-- Left Icon Mark -->
  <g transform="translate(16, -16) scale(0.68)">
    <g fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
<!-- Center Beacon Point -->
    <circle cx="256" cy="256" r="32" stroke="none" />
    
    <!-- Concentric Radar / Signal Pulse Rings -->
    <path d="M 186 256 A 70 70 0 0 1 326 256" fill="none" stroke-width="24" />
    <path d="M 186 256 A 70 70 0 0 0 326 256" fill="none" stroke-width="24" stroke-dasharray="8 20" />
    
    <path d="M 126 256 A 130 130 0 0 1 386 256" fill="none" stroke-width="24" />
    <path d="M 126 256 A 130 130 0 0 0 386 256" fill="none" stroke-width="24" stroke-dasharray="10 24" />
    
    <path d="M 66 256 A 190 190 0 0 1 446 256" fill="none" stroke-width="24" />
    <path d="M 66 256 A 190 190 0 0 0 446 256" fill="none" stroke-width="24" stroke-dasharray="12 28" />
    
    <!-- Radar Sweep Beam (45 degrees) -->
    <line x1="256" y1="256" x2="390" y2="122" stroke-width="22" />
    
    <!-- Tracked Device Nodes (LAN, WLAN, BLE) -->
    <circle cx="390" cy="122" r="22" stroke="none" />
    <circle cx="164" cy="164" r="16" stroke="none" />
    <circle cx="256" cy="386" r="16" stroke="none" />
    </g>
  </g>

  <!-- Typography on Right -->
  <g transform="translate(360, 96)">
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-1">
      Passive Device <tspan fill="#03a9f4">Tracker</tspan>
    </text>
    <text x="0" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#94a3b8" letter-spacing="0.5">
      Multi-Interface LAN, WLAN &amp; BLE Discovery
    </text>
  </g>
</svg>
