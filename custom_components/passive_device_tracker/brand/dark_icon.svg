<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
	<defs>
		<linearGradient id="ha-grad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#18BCF2" />
			<stop offset="100%" stop-color="#038FC7" />
		</linearGradient>
		<linearGradient id="sweep-grad" x1="0%" y1="0%" x2="100%" y2="100%">
			<stop offset="0%" stop-color="#18BCF2" stop-opacity="0.45" />
			<stop offset="100%" stop-color="#18BCF2" stop-opacity="0.02" />
		</linearGradient>
	</defs>
	<g transform="translate(-48.64, -48.64) scale(1.38)">
