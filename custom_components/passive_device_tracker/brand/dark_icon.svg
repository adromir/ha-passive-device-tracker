		<path d="M 103.3 122.3 A 35 35 0 0 1 152.7 122.3" fill="none" stroke="#18BCF2" stroke-width="3" stroke-linecap="round" opacity="0.85" />
		<path d="M 109.6 128.6 A 26 26 0 0 1 146.4 128.6" fill="none" stroke="#18BCF2" stroke-width="3" stroke-linecap="round" opacity="0.85" />
		<path d="M 116.7 135.7 A 16 16 0 0 1 139.3 135.7" fill="none" stroke="#18BCF2" stroke-width="3" stroke-linecap="round" opacity="0.85" />
		<path d="M 123 142 A 7 7 0 0 1 133 142" fill="none" stroke="#18BCF2" stroke-width="3" stroke-linecap="round" opacity="0.85" />
		<circle cx="128" cy="155" r="4.2" fill="#18BCF2" opacity="0.95" />
